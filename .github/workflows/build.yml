name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download ZIP
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o "偉王星_Android_GooglePlay_第一版_重製.zip" -d project

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f -exec chmod +x {} \;

      - name: Build AAB
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: "**/build/outputs/bundle/**/*.aab"
